<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>svggraphics</title>
</head>
<body>
    <h2>SVG Graphics</h2>"scalable vector graphics"
    <br>
     <svg width="1000" height="1000">
         <rect height="400" width="400" fill="orange" x="100" y="200"></rect>
         <circle cx="200" cy="100" r="30" ></circle>
         <ellipse cx="500" cy="200" rx="200" ry="200" fill="pink"></ellipse>
         <line x1="100" x2="500" y1="400" y2="400" stroke="red"></line>
         <line x1="300" x2="300" y1="200" y2="600" stroke="red"></line>
    
     </svg>
     <svg width="500" height="500">
         <polygon points="80 100 130 150 350" fill="blue"></polygon>
        <text x="200" y="400" fill="yellow"  font size="40"> CSE326 CLASS</text>
     </svg>
</body>
</html>
