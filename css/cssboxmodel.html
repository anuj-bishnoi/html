<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 600px;
            min-height: 600px;
            background-color: aqua;
            border: 11px solid black; 
            padding: 10px;
            margin: 20px;  
            border-top: 11px double black;
            border-bottom: 11px dotted black;
            border-radius: 15px;
            margin: auto;
            /*text-Formating properties*/
            font-size: 24px;
            font-style: italic;
            font-weight: 300;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;/*justify will make the line end at the same length*/
            text-align-last: center;
            text-transform: capitalize;
            text-decoration-line: underline;
            text-decoration-color: rgb(239, 18, 18);
            text-decoration-style: wavy;
            word-spacing: normal;
            line-height: 60px;
            letter-spacing: normal;
            text-shadow: 7px 5px 2px rgb(23, 21, 20);

        }
    </style>
</head>
<body>
    <!--padding:40px 55px 8px 90px;then 1 is top, 2 is right , 3 is bottom,4 is left
    padding:40-x 88px 56px;1 is top, 2 is left and right, 3 is bottom
    padding:44px 54px;1 is top and bottom , 2 is left and right-->
    <!--this property is known as shorthand property.-->
    <div>
        we are studing cse326. <br>
        I am currently sitting in block no 27 room 508a. 
    </div>
    <!--text-decoration-line/coclor/style,word-spacing,line-height,letter-spaccing,text-shadow-->
</body>
</html>
