<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="u1">Username:</label>
        <input type="text" id="u1" name="uname"  maxlength="7"
        placeholder="enter your name" size="55"><!--value attribute is used to add vale to the text box-->
        
        <br><br>
        
        <label for="p1">password:</label>
        <input type="password" id="p1" name="password" placeholder="enter your password" size="50" minlength="8">
        
        <br><br>
        
        <label for="e1">Email id</label>
        <input type="email" name="email id" placeholder="enter your email id" size="50">
        
        <br><br>
        <label for="t1">Address</label>
        <textarea name="" id="t1" rows="10" cols="12"> suratgarh</textarea>
        
        <br><br>

        <label for="">Hobbies:</label>
        <input type="checkbox" id="h1" value="sports" name="hobby">
        <label for="h1">sports</label>
        <input type="checkbox" id="h2" value="singing" name="hobby">
        <label for="h2">singing</label>
        <input type="checkbox" id="h3" name="speaking" name="hobby">
        <label for="h3">speaking</label>
        <br> <br>
        <label for="">select your course:</label>
        <input type="radio" id="z1" value="Btech" name="course" checked>
        
        <label for="z1">B tech</label>
        <input type="radio" id="z2" name="course" value="bca">

        <label for="z2">bca</label>
        <input type="radio" id="z3" name="course" value="bsc">
        <label for="z3">bsc</label>

        <br><br>

        <label for="s1">choose state</label>
        <select name="state" id="s1" size="3" multiple>
            <option value="punjab" selected>punjab</option>
            <option value="himachal">himachal</option>
            <option value="rajasthan">rajasthan</option>
        </select>


        <br><br>

        <input type="submit">

    </form>
</body>
</html>
