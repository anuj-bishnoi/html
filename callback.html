<body>
    <!--Higher order fxn
    it is a fxn hat takes another fxn as a argument,returns a fxn or does both
    Call back
    callback is a fxn passed to another fxn to be invoked by that fxn. 
    -->
    <script>
        function caculate(a,b){
            return a+b
        }
        function highorder(callback){
            console.log(callback(2,3))
        }
        highorder(caculate)
    </script>
</body>
